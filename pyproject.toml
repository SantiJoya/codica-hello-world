[project]
name = "codica-hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SantiJoya", email = "santiandre@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "more-itertools==10.5.0",
]

[project.scripts]
my-app = "my_application.scripts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_application"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
